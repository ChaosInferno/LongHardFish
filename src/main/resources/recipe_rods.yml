# Custom Crafting Recipes Configuration - Fishing Rods
# This file defines all custom crafting recipes for fishing rods
# Rods are organized by tier (1-4) with increasing difficulty

# ============================================================================
# TIER 1 - BASIC RODS (Easy to craft)
# ============================================================================

old-rod:
  # Result item - must match a CustomFishItems registry ID
  result: old-rod
  permission: longhardfish.craft.old-rod

  # 3x3 crafting grid shape
  shape:
    - "   "     # Row 1: empty
    - " 12"     # Row 2: empty, Stick, String
    - " 34"     # Row 3: empty, Stick, String

  # Map shape characters to materials
  ingredients:
    '1': STICK
    '2': STRING
    '3': STICK
    '4': STRING

