name: LongHardFish
version: 1.0
main: org.aincraft.LongHardFish
api-version: 1.20

commands:
  lhf:
    description: LongHardFish command suite
    usage: /lhf <subcommand> ...
    aliases: [ longhardfish ]
    permission: longhardfish.use
  fishdex:
    description: Open the FishDex for a specific fish id
    usage: /fishdex <fish-id>

permissions:
  longhardfish.stats:
    description: Use /fishstats to view stats
    default: true
  longhardfish.give:
    default: op
  longhardfish.tacklebox:
    default: true
  longhardfish.fishprocessor:
    default: true
  lhf.admin:
    description: Admin permission for LongHardFish utilities
    default: op

  # Rod Tier Crafting Permissions
  longhardfish.craft.rod.tier1:
    description: Craft Tier 1 rods (basic)
    default: true
  longhardfish.craft.rod.tier2:
    description: Craft Tier 2 rods (intermediate)
    default: op
  longhardfish.craft.rod.tier3:
    description: Craft Tier 3 rods (advanced)
    default: op
  longhardfish.craft.rod.tier4:
    description: Craft Tier 4 rods (masterful)
    default: op