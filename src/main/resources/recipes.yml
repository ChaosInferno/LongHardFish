# Custom Crafting Recipes Configuration
# This file defines all custom crafting recipes for the Long Hard Fish plugin

biome_radar:
  # Result item - must match a CustomFishItems registry ID
  result: biome_radar

  # 3x3 crafting grid shape
  shape:
    - "121"     # Row 1: Bucket, Comparator, Bucket
    - "343"     # Row 2: Redstone, Compass, Redstone
    - "567"     # Row 3: Sapling (any), Observer, Fern/Grass (any)

  # Map shape characters to materials
  ingredients:
    '1': BUCKET
    '2': COMPARATOR
    '3': REDSTONE
    '4': COMPASS

    # Material choice for "any sapling"
    '5':
      type: material_choice
      materials:
        - OAK_SAPLING
        - BIRCH_SAPLING
        - SPRUCE_SAPLING
        - JUNGLE_SAPLING
        - ACACIA_SAPLING
        - DARK_OAK_SAPLING
        - CHERRY_SAPLING
        - MANGROVE_PROPAGULE

    '6': OBSERVER

    # Material choice for "any grass type"
    '7':
      type: material_choice
      materials:
        - FERN
        - SHORT_GRASS
        - TALL_GRASS
        - SEAGRASS

